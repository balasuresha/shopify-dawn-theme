name: Shopify Theme Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'

jobs:
  # Job 1: Deploy to Staging Store and Publish Live
  deploy-staging:
    name: Deploy to Staging & Publish Live
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme (if needed)
        run: |
          if [ -f "package.json" ] && grep -q "build" package.json; then
            npm run build
          fi

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy to Staging Store
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_STAGING_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STAGING_STORE }}
        run: |
          echo "Deploying theme to staging store..."
          THEME_NAME="staging-deploy-$(date +%Y-%B-%d)-${{ github.run_number }}"
          echo "Theme name: $THEME_NAME"
          
          # Push theme as unpublished first with custom name
          shopify theme push --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --unpublished --theme="$THEME_NAME" --force
          echo "Theme successfully pushed with name: $THEME_NAME"
          
          # Get the theme ID
          THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r --arg name "$THEME_NAME" '.[] | select(.name == $name) | .id' | head -1)
          if [ -n "$THEME_ID" ]; then
            echo "Found theme ID: $THEME_ID"
            echo "Publishing theme live..."
            shopify theme publish --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --theme=$THEME_ID --force
            echo "Theme successfully published live on staging store"
          else
            echo "Error: Could not find theme ID to publish"
            exit 1
          fi

      - name: Create deployment summary
        env:
          STAGING_STORE: ${{ secrets.SHOPIFY_STAGING_STORE }}
        run: |
          THEME_NAME="staging-deploy-$(date +%Y-%B-%d)-${{ github.run_number }}"
          echo "## 🚀 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Store**: $STAGING_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme Name**: $THEME_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Published Live ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  # Job 2: QA Approval Gate
  qa-approval:
    name: QA Approval for Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: success()
    environment: 
      name: qa-approval
    
    steps:
      - name: QA Review Required
        env:
          STAGING_STORE: ${{ secrets.SHOPIFY_STAGING_STORE }}
        run: |
          echo "## 🔍 QA Review Required" >> $GITHUB_STEP_SUMMARY
          echo "Please review the staging deployment and approve for production." >> $GITHUB_STEP_SUMMARY
          echo "- **Staging URL**: https://$STAGING_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Review checklist**:" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Visual elements display correctly" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Functionality works as expected" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Mobile responsiveness verified" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Performance is acceptable" >> $GITHUB_STEP_SUMMARY

  # Job 3: Deploy to Production Store (Push Only)
  deploy-production-push:
    name: Push to Production Store
    runs-on: ubuntu-latest
    needs: qa-approval
    if: success()
    environment: production-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme (if needed)
        run: |
          if [ -f "package.json" ] && grep -q "build" package.json; then
            npm run build
          fi

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push to Production Store (Not Live)
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "Pushing theme to production store (not publishing live)..."
          THEME_NAME="deploy-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}"
          shopify theme push --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --unpublished --theme="$THEME_NAME" --force
          echo "Theme successfully pushed to production store (unpublished) with name: $THEME_NAME"

      - name: Get theme info
        id: theme-info
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          THEME_NAME="deploy-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}"
          
          # Wait a moment for theme to be available in the list
          sleep 5
          
          # Try to find the theme by name first
          THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r --arg name "$THEME_NAME" '.[] | select(.name == $name) | .id' | head -1)
          
          if [ -z "$THEME_ID" ]; then
            echo "Theme not found by name, searching for most recent unpublished theme with 'deploy-' prefix"
            THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.role == "unpublished" and (.name | contains("deploy-"))) | .id' | head -1)
          fi
          
          if [ -z "$THEME_ID" ]; then
            echo "Still not found, getting the most recent unpublished theme"
            THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.role == "unpublished") | .id' | head -1)
          fi
          
          # Get the actual theme name
          ACTUAL_THEME_NAME=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r --arg id "$THEME_ID" '.[] | select(.id == $id) | .name')
          
          echo "theme_id=$THEME_ID" >> $GITHUB_OUTPUT
          echo "theme_name=$ACTUAL_THEME_NAME" >> $GITHUB_OUTPUT
          echo "Theme ID: $THEME_ID"
          echo "Expected Theme Name: $THEME_NAME"
          echo "Actual Theme Name: $ACTUAL_THEME_NAME"

      - name: Create deployment summary
        env:
          PRODUCTION_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "## 📦 Production Push Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Store**: $PRODUCTION_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Pushed (Unpublished) ⏳" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme ID**: ${{ steps.theme-info.outputs.theme_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme Name**: ${{ steps.theme-info.outputs.theme_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Step**: Awaiting approval to publish live" >> $GITHUB_STEP_SUMMARY

  # Job 4: Production Publish Approval Gate
  production-publish-approval:
    name: Production Publish Approval
    runs-on: ubuntu-latest
    needs: deploy-production-push
    if: success()
    environment:
      name: production-publish
    
    steps:
      - name: Production Publish Approval Required
        env:
          PRODUCTION_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "## ⚠️ Production Publish Approval Required" >> $GITHUB_STEP_SUMMARY
          echo "Theme has been pushed to production store but is not yet live." >> $GITHUB_STEP_SUMMARY
          echo "Please review and approve to publish the theme live on production." >> $GITHUB_STEP_SUMMARY
          echo "- **Production Store**: https://$PRODUCTION_STORE" >> $GITHUB_STEP_SUMMARY

 # Job 5: Publish Theme Live on Production
  publish-production:
    name: Publish Live on Production
    runs-on: ubuntu-latest
    needs: production-publish-approval
    if: success()
    environment: production-live
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Get latest theme ID
        id: get-theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          # Get the most recent unpublished theme that starts with "deploy-" and contains current run number
          CURRENT_RUN="${{ github.run_number }}"
          echo "Looking for theme with run number: $CURRENT_RUN"
          
          # First try to find theme with current run number
          THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r --arg run "$CURRENT_RUN" '.[] | select(.role == "unpublished" and (.name | startswith("deploy-")) and (.name | contains($run))) | .id' | head -1)
          
          if [ -z "$THEME_ID" ]; then
            echo "Theme with run number not found, getting the most recent deploy theme by ID"
            THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.role == "unpublished" and (.name | startswith("deploy-"))) | .id' | sort -nr | head -1)
          fi
          
          if [ -z "$THEME_ID" ]; then
            echo "No deploy theme found, getting the most recent unpublished theme"
            THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.role == "unpublished") | .id' | sort -nr | head -1)
          fi
          
          if [ -z "$THEME_ID" ]; then
            echo "Error: No unpublished theme found to publish"
            exit 1
          fi
          
          # Get theme name for verification
          THEME_NAME=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r --arg id "$THEME_ID" '.[] | select(.id == $id) | .name')
          
          echo "theme_id=$THEME_ID" >> $GITHUB_OUTPUT
          echo "theme_name=$THEME_NAME" >> $GITHUB_OUTPUT
          echo "Selected theme ID: $THEME_ID (should be the newest)"
          echo "Selected theme name: $THEME_NAME"
          
          # List all deploy themes for debugging
          echo "All unpublished deploy themes (sorted by ID descending):"
          shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.role == "unpublished" and (.name | startswith("deploy-"))) | "\(.id): \(.name)"' | sort -nr

      # THIS IS THE MISSING STEP - ACTUALLY PUBLISH THE THEME
      - name: Publish theme live
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          THEME_ID="${{ steps.get-theme.outputs.theme_id }}"
          THEME_NAME="${{ steps.get-theme.outputs.theme_name }}"
          
          echo "Publishing theme ID: $THEME_ID ($THEME_NAME) to live..."
          
          # Publish the theme live
          shopify theme publish --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --theme=$THEME_ID --force
          
          echo "✅ Theme successfully published live!"
          echo "Theme ID $THEME_ID is now the live theme on production store"

      - name: Create final deployment summary
        env:
          PRODUCTION_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "## 🎉 Production Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Store**: https://$PRODUCTION_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Published Live ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme ID**: ${{ steps.get-theme.outputs.theme_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme Name**: ${{ steps.get-theme.outputs.theme_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

      - name: Clean up old themes (optional)
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "Cleaning up old deploy themes (keeping last 5)..."
          
          # Get all unpublished deploy themes sorted by ID (newest first)
          OLD_THEMES=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.role == "unpublished" and (.name | startswith("deploy-"))) | .id' | sort -nr | tail -n +6)
          
          if [ -n "$OLD_THEMES" ]; then
            echo "Deleting old themes:"
            for theme_id in $OLD_THEMES; do
              echo "Deleting theme ID: $theme_id"
              shopify theme delete --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --theme=$theme_id --force || echo "Failed to delete theme $theme_id"
            done
          else
            echo "No old themes to delete"
          fi
