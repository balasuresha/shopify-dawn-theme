name: Shopify Theme Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'

jobs:
  # Job 1: Deploy to Staging Store and Publish Live
  deploy-staging:
    name: Deploy to Staging & Publish Live
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme (if needed)
        run: |
          if [ -f "package.json" ] && grep -q "build" package.json; then
            npm run build
          fi

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy to Staging Store
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_STAGING_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STAGING_STORE }}
        run: |
          echo "Deploying theme to staging store..."
          shopify theme push --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --live --force
          echo "Theme successfully deployed and published live on staging store"

      - name: Create deployment summary
        env:
          STAGING_STORE: ${{ secrets.SHOPIFY_STAGING_STORE }}
        run: |
          echo "## 🚀 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Store**: $STAGING_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Published Live ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  # Job 2: QA Approval Gate
  qa-approval:
    name: QA Approval for Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: success()
    environment: 
      name: qa-approval
    
    steps:
      - name: QA Review Required
        env:
          STAGING_STORE: ${{ secrets.SHOPIFY_STAGING_STORE }}
        run: |
          echo "## 🔍 QA Review Required" >> $GITHUB_STEP_SUMMARY
          echo "Please review the staging deployment and approve for production." >> $GITHUB_STEP_SUMMARY
          echo "- **Staging URL**: https://$STAGING_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Review checklist**:" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Visual elements display correctly" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Functionality works as expected" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Mobile responsiveness verified" >> $GITHUB_STEP_SUMMARY
          echo "  - [ ] Performance is acceptable" >> $GITHUB_STEP_SUMMARY

  # Job 3: Deploy to Production Store (Push Only)
  deploy-production-push:
    name: Push to Production Store
    runs-on: ubuntu-latest
    needs: qa-approval
    if: success()
    environment: production-push
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme (if needed)
        run: |
          if [ -f "package.json" ] && grep -q "build" package.json; then
            npm run build
          fi

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push to Production Store (Not Live)
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "Pushing theme to production store (not publishing live)..."
          shopify theme push --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --unpublished --force
          echo "Theme successfully pushed to production store (unpublished)"

      - name: Get theme info
        id: theme-info
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.name | contains("'"$(date +%Y%m%d)"'")) | .id' | head -1)
          echo "theme_id=$THEME_ID" >> $GITHUB_OUTPUT
          echo "Theme ID: $THEME_ID"

      - name: Create deployment summary
        env:
          PRODUCTION_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "## 📦 Production Push Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Store**: $PRODUCTION_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Pushed (Unpublished) ⏳" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme ID**: ${{ steps.theme-info.outputs.theme_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Step**: Awaiting approval to publish live" >> $GITHUB_STEP_SUMMARY

  # Job 4: Production Publish Approval Gate
  production-publish-approval:
    name: Production Publish Approval
    runs-on: ubuntu-latest
    needs: deploy-production-push
    if: success()
    environment:
      name: production-publish
    
    steps:
      - name: Production Publish Approval Required
        env:
          PRODUCTION_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "## ⚠️ Production Publish Approval Required" >> $GITHUB_STEP_SUMMARY
          echo "Theme has been pushed to production store but is not yet live." >> $GITHUB_STEP_SUMMARY
          echo "Please review and approve to publish the theme live on production." >> $GITHUB_STEP_SUMMARY
          echo "- **Production Store**: https://$PRODUCTION_STORE" >> $GITHUB_STEP_SUMMARY

  # Job 5: Publish Theme Live on Production
  publish-production:
    name: Publish Live on Production
    runs-on: ubuntu-latest
    needs: production-publish-approval
    if: success()
    environment: production-live
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Get latest theme ID
        id: get-theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          # Get the most recent unpublished theme
          THEME_ID=$(shopify theme list --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --json | jq -r '.[] | select(.role == "unpublished") | .id' | head -1)
          echo "theme_id=$THEME_ID" >> $GITHUB_OUTPUT
          echo "Found theme ID: $THEME_ID"

      - name: Publish Theme Live
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_PRODUCTION_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "Publishing theme live on production store..."
          shopify theme publish --store=$SHOPIFY_STORE --password=$SHOPIFY_CLI_THEME_TOKEN --theme=${{ steps.get-theme.outputs.theme_id }}
          echo "Theme successfully published live on production store!"

      - name: Create final deployment summary
        env:
          PRODUCTION_STORE: ${{ secrets.SHOPIFY_PRODUCTION_STORE }}
        run: |
          echo "## 🎉 Production Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "- **Store**: $PRODUCTION_STORE" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Published Live ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Theme ID**: ${{ steps.get-theme.outputs.theme_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: https://$PRODUCTION_STORE" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment success
        run: |
          echo "🚀 Theme deployment pipeline completed successfully!"
          echo "Production store is now live with the latest theme."

  # Cleanup job for failed deployments
  cleanup-on-failure:
    name: Cleanup on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-staging, qa-approval, deploy-production-push, production-publish-approval, publish-production]
    
    steps:
      - name: Deployment failure notification
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "The deployment pipeline has failed. Please check the logs and retry." >> $GITHUB_STEP_SUMMARY
          echo "- **Failed at**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
